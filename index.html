<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>搜貨衣櫃</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #f7f4ef;
        color: #202225;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", Arial, sans-serif;
      }
      main {
        width: min(900px, 100%);
        margin: 0 auto;
        padding: 18px 14px 36px;
      }
      h1 {
        margin: 0;
        font-size: 2.15rem;
        line-height: 1.15;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 1.1rem;
      }
      .status {
        margin: 12px 0 16px;
        border: 1px solid #b8ddd3;
        border-radius: 8px;
        background: #e7f4ef;
        padding: 12px;
        font-weight: 800;
        color: #115e59;
      }
      section {
        margin-top: 12px;
        border: 1px solid #ded7cc;
        border-radius: 8px;
        background: #fff;
        padding: 14px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      label span {
        display: block;
        margin-bottom: 5px;
        color: #707070;
        font-size: 0.82rem;
        font-weight: 800;
      }
      input, select, textarea, button {
        width: 100%;
        min-height: 44px;
        border-radius: 8px;
        font: inherit;
      }
      input, select, textarea {
        border: 1px solid #ded7cc;
        background: #fffdf9;
        padding: 10px;
      }
      button {
        border: 0;
        background: #0f766e;
        color: #fff;
        font-weight: 900;
      }
      .button-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 12px;
      }
      .secondary {
        background: #202225;
      }
      .links {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .links a {
        display: flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: #f0ece5;
        color: #0f4c81;
        text-decoration: none;
        font-weight: 900;
      }
      .item {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 8px;
        border: 1px solid #ded7cc;
        border-radius: 8px;
        padding: 10px;
      }
      .item button {
        width: auto;
        min-width: 44px;
        min-height: 36px;
        background: #b94b5f;
        padding: 0 10px;
      }
      .item .load {
        background: #0f766e;
      }
      .result {
        margin-top: 10px;
        border-radius: 8px;
        background: #f4efe6;
        padding: 12px;
        font-weight: 800;
      }
      textarea {
        min-height: 130px;
      }
      @media (max-width: 520px) {
        .grid, .button-row, .links {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>搜貨衣櫃</h1>
      <div class="status" id="status">v6 已啟動。最高價會當成篩選條件，不會塞進品牌關鍵字。</div>

      <section>
        <h2>搜尋條件</h2>
        <div class="grid">
          <label>
            <span>品牌</span>
            <input id="brand" value="a la sha">
          </label>
          <label>
            <span>同義字</span>
            <input id="alias" value="阿財 alasha">
          </label>
          <label>
            <span>最高價</span>
            <input id="price" type="number" value="300">
          </label>
          <label>
            <span>品項</span>
            <select id="category">
              <option value="二手 衣服">二手衣服</option>
              <option value="二手 上衣">上衣</option>
              <option value="二手 洋裝">洋裝</option>
              <option value="二手 外套">外套</option>
              <option value="二手 裙子">裙子</option>
              <option value="二手 包">包包</option>
            </select>
          </label>
        </div>
        <div class="button-row">
          <button id="updateButton" type="button">更新搜尋連結</button>
          <button class="secondary" id="saveButton" type="button">加入搜尋清單</button>
        </div>
      </section>

      <section>
        <h2>平台搜尋</h2>
        <div class="links">
          <a id="shopee" target="_blank" rel="noreferrer">蝦皮</a>
          <a id="yahoo" target="_blank" rel="noreferrer">Yahoo</a>
          <a id="ruten" target="_blank" rel="noreferrer">露天</a>
          <a id="google" target="_blank" rel="noreferrer">Google</a>
        </div>
      </section>

      <section>
        <h2>搜尋清單</h2>
        <div class="result">把常搜的品牌和價格存起來。之後按「載入」就不用重打，再按上面的蝦皮、Yahoo、露天或 Google。</div>
        <div id="monitorList"></div>
      </section>

      <section>
        <h2>利潤試算</h2>
        <div class="grid">
          <label><span>進貨</span><input id="buy" type="number" value="200"></label>
          <label><span>售價</span><input id="sell" type="number" value="590"></label>
          <label><span>運費/清潔</span><input id="cost" type="number" value="60"></label>
          <label><span>平台費%</span><input id="fee" type="number" value="6"></label>
        </div>
        <div class="result" id="profit">預估淨利：$0</div>
      </section>

      <section>
        <h2>議價文字</h2>
        <textarea id="message"></textarea>
        <div class="button-row">
          <button id="copyButton" type="button">複製文字</button>
          <button class="secondary" id="clearButton" type="button">清空監控</button>
        </div>
      </section>
    </main>

    <script>
      (function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            registrations.forEach(function (registration) {
              registration.unregister();
            });
          });
        }
        if ("caches" in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (key) {
              caches.delete(key);
            });
          });
        }

        var monitors = [];

        function byId(id) {
          return document.getElementById(id);
        }

        function enc(text) {
          return encodeURIComponent(text);
        }

        function getData() {
          return {
            brand: byId("brand").value || "a la sha",
            alias: byId("alias").value || "",
            price: byId("price").value || "300",
            category: byId("category").value || "二手 衣服"
          };
        }

        function updateLinks() {
          var data = getData();
          var q = data.brand + " " + data.alias + " " + data.category;
          byId("shopee").href = "https://shopee.tw/search?keyword=" + enc(q) + "&maxPrice=" + enc(data.price);
          byId("yahoo").href = "https://tw.bid.yahoo.com/search/auction/product?p=" + enc(q) + "&refine=con_used&sort=price&minp=0&maxp=" + enc(data.price);
          byId("ruten").href = "https://www.ruten.com.tw/find/?q=" + enc(q);
          byId("google").href = "https://www.google.com/search?q=" + enc(q + " " + data.price + "元以下");
          updateMessage();
        }

        function updateMessage() {
          var data = getData();
          byId("message").value = "你好，我有在找 " + data.brand + " 二手衣，請問這件還在嗎？如果衣況乾淨、沒有明顯污漬或破損，想跟你購買。多件一起帶的話，方便幫我算 " + data.price + " 元以內或批價嗎？謝謝。";
        }

        function renderMonitors() {
          var list = byId("monitorList");
          if (!monitors.length) {
            list.innerHTML = '<div class="result">還沒有搜尋條件，先按「加入監控」。</div>';
            return;
          }
          list.innerHTML = monitors.map(function (item, index) {
            return '<div class="item"><div><strong>' + item.brand + '</strong><br><small>' + item.category + " / " + item.price + '元內</small></div><div><button class="load" data-load="' + index + '">載入</button> <button data-delete="' + index + '">X</button></div></div>';
          }).join("");
        }

        function loadMonitor(index) {
          var item = monitors[index];
          if (!item) return;
          byId("brand").value = item.brand;
          byId("alias").value = item.alias;
          byId("price").value = item.price;
          byId("category").value = item.category;
          updateLinks();
          byId("status").textContent = "已載入：" + item.brand + "，現在可以按平台搜尋。";
          window.scrollTo(0, 0);
        }

        function updateProfit() {
          var buy = Number(byId("buy").value || 0);
          var sell = Number(byId("sell").value || 0);
          var cost = Number(byId("cost").value || 0);
          var fee = Number(byId("fee").value || 0) / 100;
          var profit = Math.round(sell - buy - cost - sell * fee);
          byId("profit").textContent = "預估淨利：$" + profit;
        }

        byId("updateButton").onclick = function () {
          updateLinks();
          byId("status").textContent = "搜尋連結已更新。蝦皮和 Yahoo 會嘗試帶入最高價，露天進入後再手動篩價。";
        };

        byId("saveButton").onclick = function () {
          monitors.unshift(getData());
          renderMonitors();
          byId("status").textContent = "已加入監控：" + getData().brand;
        };

        byId("monitorList").onclick = function (event) {
          var loadIndex = event.target.getAttribute("data-load");
          var deleteIndex = event.target.getAttribute("data-delete");
          if (loadIndex !== null) {
            loadMonitor(Number(loadIndex));
          }
          if (deleteIndex !== null) {
            monitors.splice(Number(deleteIndex), 1);
            renderMonitors();
          }
        };

        byId("copyButton").onclick = function () {
          byId("message").select();
          document.execCommand("copy");
          byId("status").textContent = "議價文字已複製。";
        };

        byId("clearButton").onclick = function () {
          monitors = [];
          renderMonitors();
          byId("status").textContent = "監控已清空。";
        };

        ["brand", "alias", "price", "category"].forEach(function (id) {
          byId(id).oninput = updateLinks;
          byId(id).onchange = updateLinks;
        });

        ["buy", "sell", "cost", "fee"].forEach(function (id) {
          byId(id).oninput = updateProfit;
        });

        updateLinks();
        updateProfit();
        renderMonitors();
      })();
    </script>
  </body>
</html>
