<head>

<title>二手衣搜貨雷達</title>
<style>
:root{--bg:#f7f4ef;--card:#fff;--ink:#202225;--muted:#707070;--line:#ded7cc;--green:#0f766e;--green2:#115e59;--blue:#315c99;--soft:#f0ece5;--warn:#b7791f;--bad:#b94b5f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif}main{width:min(1040px,100%);margin:auto;padding:18px 14px 42px}h1,h2,h3{margin:0;line-height:1.2}h1{font-size:2rem}h2{font-size:1.08rem}button,input,select,textarea{font:inherit}button{min-height:44px;border:0;border-radius:8px;background:var(--green);color:#fff;font-weight:900;padding:0 12px}button.secondary{background:var(--ink)}button.light{background:var(--soft);color:var(--ink)}button.danger{background:var(--bad)}button.small{min-height:36px;padding:0 10px}input,select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:#fffdf9;color:var(--ink);padding:10px}textarea{min-height:120px;resize:vertical}label span{display:block;margin-bottom:5px;color:var(--muted);font-size:.82rem;font-weight:800}.version{margin-top:5px;color:var(--green2);font-weight:900}.status,.note{margin-top:10px;border-radius:8px;background:#e7f4ef;color:var(--green2);padding:10px;font-weight:800}.note{background:#f4efe6;color:var(--muted);font-weight:500;line-height:1.45}.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.tabs button{background:#fff;color:var(--muted);border:1px solid var(--line)}.tabs button.active{background:#e7f4ef;color:var(--green2);border-color:var(--green)}section{display:none;margin-top:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:14px}section.active{display:block}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.actions,.links,.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.links{grid-template-columns:repeat(3,minmax(0,1fr))}.links a,.item a{display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--soft);color:var(--blue);font-weight:900;text-decoration:none;min-height:46px;text-align:center}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{border:1px solid var(--line);border-radius:8px;background:#fffdf9;padding:10px}.stat span{display:block;color:var(--muted);font-size:.8rem;font-weight:800}.stat strong{font-size:1.25rem}.list{display:grid;gap:9px;margin-top:12px}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;background:#fffdf9;padding:10px}.item strong{display:block;overflow-wrap:anywhere}.item small{display:block;margin-top:4px;color:var(--muted);line-height:1.35}.item-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.badge{display:inline-block;border-radius:999px;background:#e7f4ef;color:var(--green2);padding:3px 9px;font-size:.8rem;font-weight:900}.badge.warn{background:#fff3d6;color:var(--warn)}.badge.bad{background:#f8e7e9;color:var(--bad)}.score{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-top:12px;border-radius:8px;background:#e7f4ef;padding:12px}.score strong{font-size:1.8rem;color:var(--green2)}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:720px){.tabs{grid-template-columns:repeat(3,1fr)}.grid,.grid.two,.actions,.links,.stats,.split{grid-template-columns:1fr}.item{grid-template-columns:1fr}.item-actions{justify-content:flex-start}}
</style>
</head>
<body><main>
<h1>二手衣搜貨雷達</h1><div class="version">v10 實戰版</div><div class="status" id="status">已啟動。這版加入上架文案、實際賣價、天數和品牌統計。</div>
<div class="stats"><div class="stat"><span>商品紀錄</span><strong id="topItems">0</strong></div><div class="stat"><span>已賣出</span><strong id="topSold">0</strong></div><div class="stat"><span>預估淨利</span><strong id="topProfit">$0</strong></div><div class="stat"><span>待處理</span><strong id="topTodo">0</strong></div></div>
<nav class="tabs"><button class="tab active" data-page="search">搜貨</button><button class="tab" data-page="judge">判斷</button><button class="tab" data-page="items">商品</button><button class="tab" data-page="copy">文案</button><button class="tab" data-page="stats">統計</button><button class="tab" data-page="backup">備份</button></nav>
<section class="active" id="search"><h2>搜貨條件</h2><div class="grid"><label><span>品牌預設</span><select id="preset"></select></label><label><span>品牌</span><input id="brand" value="組曲"></label><label><span>同義字</span><input id="alias" value="KUMIKYOKU 日本組曲"></label><label><span>品項</span><input id="cat" list="cats" value="二手 洋裝"><datalist id="cats"><option value="二手 衣服"><option value="二手 上衣"><option value="二手 洋裝"><option value="二手 外套"><option value="二手 針織"><option value="二手 襯衫"><option value="二手 裙子"><option value="二手 長褲"><option value="二手 包"><option value="二手 連帽外套"></datalist></label><label><span>最高進貨價</span><input id="max" type="number" value="300"></label><label><span>排除字</span><input id="exclude" value="童裝 瑕疵 售出 代購"></label></div><div class="actions"><button id="saveSearch">加入搜尋清單</button><button class="secondary" id="copySearch">複製搜尋文字</button></div><div class="links" id="links"></div><div class="note" id="hint"></div><h3 style="margin-top:16px">搜尋清單</h3><div class="list" id="searchList"></div></section>
<section id="judge"><h2>進貨判斷</h2><div class="grid"><label><span>商品名稱</span><input id="title" value="組曲 二手洋裝"></label><label><span>品牌</span><input id="itemBrand" value="組曲"></label><label><span>平台</span><input id="platform" value="蝦皮"></label><label><span>商品網址</span><input id="url" placeholder="貼商品網址"></label><label><span>進貨價</span><input id="buy" type="number" value="300"></label><label><span>預估售價</span><input id="sell" type="number" value="790"></label><label><span>實際賣價</span><input id="actualSell" type="number" placeholder="賣出後填"></label><label><span>清潔/運費成本</span><input id="extra" type="number" value="60"></label><label><span>平台費%</span><input id="fee" type="number" value="6"></label><label><span>衣況</span><select id="cond"><option value="30">近新</option><option value="22">乾淨</option><option value="12">普通</option><option value="0">需整理</option></select></label><label><span>尺寸</span><select id="size"><option value="15">M/L/XL</option><option value="10">F/均碼</option><option value="6">S/XS</option><option value="4">不清楚</option></select></label><label><span>款式</span><select id="style"><option value="16">外套/洋裝/包</option><option value="12">襯衫/裙褲/針織</option><option value="7">普通上衣</option></select></label><label><span>狀態</span><select id="statusSel"><option>想問</option><option>已問</option><option>已買</option><option>已上架</option><option>已賣出</option><option>放棄</option></select></label><label><span>上架日</span><input id="listedAt" type="date"></label><label><span>賣出日</span><input id="soldAt" type="date"></label></div><div class="score"><div><strong id="judgeText">可以問</strong><div id="profitText">預估淨利 $0</div></div><strong id="scoreText">0</strong></div><div class="actions"><button id="saveItem">存成商品紀錄</button><button class="secondary" id="fromSearch">用目前搜貨條件帶入</button></div><div class="note" id="judgeNote"></div></section>
<section id="items"><h2>商品紀錄</h2><div class="grid two"><label><span>篩選狀態</span><select id="filterStatus"><option value="">全部</option><option>想問</option><option>已問</option><option>已買</option><option>已上架</option><option>已賣出</option><option>放棄</option></select></label><label><span>搜尋品牌/商品</span><input id="filterText" placeholder="例如 組曲"></label></div><div class="list" id="itemList"></div></section>
<section id="copy"><h2>上架與議價文案</h2><div class="split"><div><label><span>上架標題</span><input id="listingTitle"></label><label><span>商品描述</span><textarea id="listingBody"></textarea></label><button id="copyListing">複製上架文案</button></div><div><label><span>議價訊息</span><textarea id="askBody"></textarea></label><button class="secondary" id="copyAsk">複製議價訊息</button><div class="note">文案會用「判斷」頁目前的商品資料產生。載入商品後再來這頁複製最準。</div></div></div></section>
<section id="stats"><h2>賣貨統計</h2><div class="stats"><div class="stat"><span>商品紀錄</span><strong id="statItems">0</strong></div><div class="stat"><span>已賣出</span><strong id="statSold">0</strong></div><div class="stat"><span>預估總淨利</span><strong id="statProfit">$0</strong></div><div class="stat"><span>平均淨利</span><strong id="statAvg">$0</strong></div></div><h3 style="margin-top:16px">品牌表現</h3><div class="list" id="brandStats"></div><h3 style="margin-top:16px">待處理提醒</h3><div class="list" id="todoList"></div></section>
<section id="backup"><h2>備份資料</h2><div class="actions"><button id="exportData">匯出資料</button><button class="secondary" id="importData">匯入資料</button></div><textarea id="dataBox" placeholder="匯出的資料會在這裡。換手機時可以複製備份。"></textarea><div class="actions"><button class="light" id="copyData">複製備份</button><button class="danger" id="clearAll">清空全部</button></div><div class="note">資料存在同一台手機或電腦的瀏覽器裡。換手機、無痕模式、清除網站資料，都會看不到原本紀錄；要換裝置請先匯出備份。</div></section>
</main><script>
(function(){var KEY="secondhandRadarV10",OLD="secondhandRadarV9",presets=[["組曲","KUMIKYOKU 日本組曲",300,"二手 洋裝","童裝 瑕疵 售出 代購"],["any SiS","anysis any SiS",300,"二手 衣服","童裝 瑕疵 售出"],["23區","23ku 23区 ONWARD",500,"二手 外套","童裝 瑕疵 售出"],["ICB","iCB ONWARD",500,"二手 襯衫","童裝 瑕疵 售出"],["自由區","Jiyuku 自由区 ONWARD",600,"二手 衣服","童裝 瑕疵 售出"],["a la sha","阿財 alasha",300,"二手 衣服","童裝 瑕疵 售出 高價"],["UNIQLO","優衣庫 UQ",250,"二手 外套","瑕疵 售出"],["GU","g.u.",180,"二手 衣服","瑕疵 售出"],["MUJI","無印良品",250,"二手 襯衫","瑕疵 售出"]],state=load();function $(id){return document.getElementById(id)}function today(){return new Date().toISOString().slice(0,10)}function money(n){return"$"+Math.round(Number(n)||0)}function enc(t){return encodeURIComponent(t)}function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}function days(a,b){if(!a)return"";return Math.max(0,Math.round((new Date(b||new Date())-new Date(a))/86400000))}function load(){try{var raw=localStorage.getItem(KEY)||localStorage.getItem(OLD);if(raw){var o=JSON.parse(raw);o.searches=o.searches||[];o.items=(o.items||[]).map(function(it){it.actualSellPrice=it.actualSellPrice||0;it.listedAt=it.listedAt||"";it.soldAt=it.soldAt||"";return it});return o}}catch(e){}return{searches:[],items:[]}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){setStatus("瀏覽器不允許存檔。")}}function setStatus(t){$("status").textContent=t}function currentSearch(){return{brand:$("brand").value.trim()||"組曲",alias:$("alias").value.trim(),category:$("cat").value.trim()||"二手 衣服",maxPrice:Number($("max").value||0),exclude:$("exclude").value.trim(),createdAt:today()}}function kw(s,p){var t=[s.brand,s.alias,s.category].filter(Boolean).join(" ");if(p&&s.maxPrice)t+=" "+s.maxPrice+"元以下";return t}function ex(s){return(s.exclude||"").split(/\s+/).filter(Boolean).map(function(w){return"-"+w}).join(" ")}function urls(s){var q=kw(s,false),g=(kw(s,true)+" "+ex(s)).trim();return[["蝦皮","https://shopee.tw/search?keyword="+enc(q)+(s.maxPrice?"&maxPrice="+enc(s.maxPrice):"")],["Yahoo","https://tw.bid.yahoo.com/search/auction/product?p="+enc(q)+"&refine=con_used&sort=price"+(s.maxPrice?"&minp=0&maxp="+enc(s.maxPrice):"")],["露天","https://www.ruten.com.tw/find/?q="+enc(q)],["Google","https://www.google.com/search?q="+enc(g)],["蝦皮精準","https://www.google.com/search?q="+enc(g+" site:shopee.tw")],["Yahoo精準","https://www.google.com/search?q="+enc(g+" site:tw.bid.yahoo.com")]]}function renderLinks(){var s=currentSearch();$("links").innerHTML=urls(s).map(function(x){return'<a href="'+x[1]+'" target="_blank" rel="noreferrer">'+x[0]+"</a>"}).join("");$("hint").textContent="搜尋字："+kw(s,false)+"。最高價會盡量用平台價格參數；Google 才會用「元以下」文字。"}function renderSearches(){save();$("searchList").innerHTML=state.searches.length?state.searches.map(function(s,i){return'<div class="item"><div><strong>'+esc(s.brand)+'</strong><small>'+esc(s.category)+" / "+money(s.maxPrice)+"內 / 排除："+esc(s.exclude||"無")+'</small></div><div class="item-actions"><button class="small" data-load-search="'+i+'">載入</button><button class="small danger" data-del-search="'+i+'">刪</button></div></div>'}).join(""):'<div class="note">還沒有搜尋條件。先設定品牌和最高價，再按「加入搜尋清單」。</div>'}function applyPreset(i){var p=presets[i];if(!p)return;$("brand").value=p[0];$("alias").value=p[1];$("max").value=p[2];$("cat").value=p[3];$("exclude").value=p[4];renderLinks()}function loadSearch(i){var s=state.searches[i];if(!s)return;$("brand").value=s.brand;$("alias").value=s.alias||"";$("cat").value=s.category||"二手 衣服";$("max").value=s.maxPrice||0;$("exclude").value=s.exclude||"";renderLinks();setStatus("已載入 "+s.brand+"，可以按平台搜尋。");window.scrollTo(0,0)}function calc(){var buy=+$("buy").value||0,sell=+$("sell").value||0,actual=+$("actualSell").value||0,extra=+$("extra").value||0,fee=(+$("fee").value||0)/100,base=actual||sell,profit=Math.round(base-buy-extra-base*fee),margin=base?Math.max(0,Math.min(30,((base-buy)/base)*45)):0,score=Math.round(margin+(+$("cond").value)+(+$("size").value)+(+$("style").value)),judge="不收",cls="bad";if(score>=78&&profit>=250){judge="值得收";cls=""}else if(score>=62&&profit>=130){judge="可以問";cls="warn"}else if(profit>=80){judge="壓價再收";cls="warn"}$("judgeText").innerHTML='<span class="badge '+cls+'">'+judge+"</span>";$("profitText").textContent=(actual?"實際":"預估")+"淨利 "+money(profit)+"，進貨價最好不要超過售價的 40%。";$("scoreText").textContent=score;$("judgeNote").textContent=profit<100?"利潤太薄，除非很快賣或可以組套，不然不要囤。":"記得確認品牌標、尺寸標、洗標、瑕疵近照和實量。";renderCopy();return{profit:profit,score:score,judge:judge}}function currentItem(){var r=calc();return{title:$("title").value.trim()||"未命名商品",brand:$("itemBrand").value.trim()||$("brand").value.trim()||"未分類",platform:$("platform").value.trim()||"未填",url:$("url").value.trim(),buyPrice:+$("buy").value||0,sellPrice:+$("sell").value||0,actualSellPrice:+$("actualSell").value||0,extraCost:+$("extra").value||0,feeRate:+$("fee").value||0,status:$("statusSel").value,profit:r.profit,score:r.score,judge:r.judge,listedAt:$("listedAt").value,soldAt:$("soldAt").value,createdAt:today()}}function renderItems(){save();var st=$("filterStatus").value,tx=$("filterText").value.trim().toLowerCase(),arr=state.items.filter(function(it){return(!st||it.status===st)&&(!tx||(it.title+" "+it.brand+" "+it.platform).toLowerCase().indexOf(tx)>=0)});$("itemList").innerHTML=arr.length?arr.map(function(it){var i=state.items.indexOf(it),bc=it.status==="已賣出"?"":it.status==="放棄"?"bad":"warn",d=it.listedAt?(" / 上架 "+days(it.listedAt,it.soldAt||"")+"天"):"";return'<div class="item"><div><strong>'+esc(it.title)+'</strong><small>'+esc(it.brand)+" / "+esc(it.platform)+" / "+money(it.buyPrice)+"進 / "+money(it.actualSellPrice||it.sellPrice)+"賣 / 淨利 "+money(it.profit)+d+' / <span class="badge '+bc+'">'+esc(it.status)+'</span></small></div><div class="item-actions">'+(it.url?'<a href="'+esc(it.url)+'" target="_blank" rel="noreferrer">開</a>':"")+'<button class="small" data-edit="'+i+'">載入</button><button class="small light" data-cycle="'+i+'">狀態</button><button class="small danger" data-del="'+i+'">刪</button></div></div>'}).join(""):'<div class="note">還沒有符合條件的商品紀錄。</div>'}function loadItem(i){var it=state.items[i];if(!it)return;$("title").value=it.title;$("itemBrand").value=it.brand;$("platform").value=it.platform;$("url").value=it.url;$("buy").value=it.buyPrice;$("sell").value=it.sellPrice;$("actualSell").value=it.actualSellPrice||"";$("extra").value=it.extraCost;$("fee").value=it.feeRate;$("statusSel").value=it.status;$("listedAt").value=it.listedAt||"";$("soldAt").value=it.soldAt||"";calc();show("judge");setStatus("已載入商品："+it.title)}function cycle(i){var order=["想問","已問","已買","已上架","已賣出","放棄"],it=state.items[i];if(!it)return;it.status=order[(order.indexOf(it.status)+1)%order.length];if(it.status==="已上架"&&!it.listedAt)it.listedAt=today();if(it.status==="已賣出"&&!it.soldAt)it.soldAt=today();renderItems();renderStats()}function renderStats(){var total=state.items.reduce(function(s,it){return s+(+it.profit||0)},0),sold=state.items.filter(function(it){return it.status==="已賣出"}),todo=state.items.filter(function(it){return["想問","已問","已買"].indexOf(it.status)>=0});["topItems","statItems"].forEach(function(id){$(id).textContent=state.items.length});["topSold","statSold"].forEach(function(id){$(id).textContent=sold.length});["topProfit","statProfit"].forEach(function(id){$(id).textContent=money(total)});$("topTodo").textContent=todo.length;$("statAvg").textContent=money(state.items.length?total/state.items.length:0);var b={};state.items.forEach(function(it){b[it.brand]=b[it.brand]||{c:0,s:0,p:0};b[it.brand].c++;b[it.brand].p+=+it.profit||0;if(it.status==="已賣出")b[it.brand].s++});var rows=Object.keys(b).sort(function(a,c){return b[c].p-b[a].p});$("brandStats").innerHTML=rows.length?rows.map(function(k){return'<div class="item"><div><strong>'+esc(k)+'</strong><small>紀錄 '+b[k].c+" / 已賣 "+b[k].s+" / 淨利 "+money(b[k].p)+"</small></div></div>"}).join(""):'<div class="note">還沒有品牌統計。先存幾筆商品紀錄。</div>';$("todoList").i
